[client]
name = "Northgate Bank"
process = "first line support ticket triage"
tickets_per_day = 4200
manual_minutes_per_ticket = 4.5
agent_cost_per_hour_usd = 22.0

[policy]
auto_accuracy_floor = 0.95
max_p95_latency_ms = 800
screener_min_confidence = 0.90
resolver_min_confidence = 0.70
out_of_scope_label = "out_of_scope"
out_of_scope_queue = "unsupported"

[entities]
types = ["amount", "currency", "card_last4", "date", "merchant"]

[queues.cards_ops]
team = "Cards Operations"
priority = "P3"
actions = ["create_case"]
auto = true

[queues.atm_cash]
team = "ATM and Cash"
priority = "P2"
actions = ["create_case"]
auto = true

[queues.payments_disputes]
team = "Payments Disputes"
priority = "P2"
actions = ["create_case"]
auto = true

[queues.transfers]
team = "Transfers"
priority = "P2"
actions = ["create_case"]
auto = true

[queues.topups]
team = "Top Ups"
priority = "P3"
actions = ["create_case"]
auto = true

[queues.fx_fees]
team = "Pricing and FX"
priority = "P4"
actions = ["send_template_reply"]
auto = true
template = "fees_and_fx"

[queues.product_info]
team = "Product Support"
priority = "P4"
actions = ["send_template_reply"]
auto = true
template = "product_coverage"

[queues.account_admin]
team = "Account Administration"
priority = "P3"
actions = ["create_case"]
auto = true

[queues.account_access]
team = "Account Access"
priority = "P2"
actions = ["send_reset_link"]
auto = true

[queues.identity_kyc]
team = "Identity and KYC"
priority = "P2"
actions = ["escalate_to_human"]
auto = false

[queues.security_fraud]
team = "Fraud and Security"
priority = "P1"
actions = ["freeze_card", "escalate_to_human"]
auto = false

[queues.unsupported]
team = "General Support"
priority = "P3"
actions = ["escalate_to_human"]
auto = false

